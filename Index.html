<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #eef0f3;
      --muted: #8a8f98;
      --accent: #6ee7b7;
      --chip: #232733;
      --chip-active: #6ee7b7;
      --chip-active-text: #0f1115;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 16px 60px;
      min-height: 100vh;
    }
    .card { width: 100%; max-width: 420px; }
    h1 { font-size: 20px; font-weight: 600; margin: 8px 0 2px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .step { display: none; }
    .step.active { display: block; }
    .label { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .hint { color: var(--muted); font-size: 13px; margin-bottom: 12px; margin-top: -6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      background: var(--chip); color: var(--text); border: none; border-radius: 20px;
      padding: 10px 16px; font-size: 14px; cursor: pointer; transition: background 0.15s, color 0.15s;
      text-align: left;
    }
    .chip.selected { background: var(--chip-active); color: var(--chip-active-text); font-weight: 600; }
    input[type="text"], textarea {
      width: 100%; background: var(--card); border: 1px solid #2a2f3a; color: var(--text);
      border-radius: 12px; padding: 12px 14px; font-size: 15px; outline: none; font-family: inherit;
    }
    textarea { resize: none; min-height: 90px; }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
    .nav { display: flex; gap: 10px; margin-top: 32px; }
    button.primary {
      flex: 1; background: var(--accent); color: #0f1115; border: none; border-radius: 14px;
      padding: 15px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button.secondary {
      background: transparent; color: var(--muted); border: 1px solid #2a2f3a; border-radius: 14px;
      padding: 15px 18px; font-size: 15px; cursor: pointer;
    }
    button:disabled { opacity: 0.4; }
    .done { display: none; text-align: center; padding-top: 40px; }
    .done.active { display: block; }
    .check { font-size: 44px; margin-bottom: 4px; }
    .done h2 { font-size: 18px; margin: 0 0 24px; }
    .reminder-card {
      background: var(--card); border: 1px solid #2a2f3a; border-radius: 14px;
      padding: 16px; text-align: left; margin-bottom: 14px;
    }
    .reminder-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--accent); font-weight: 700; margin-bottom: 8px;
    }
    .reminder-text { font-size: 15px; line-height: 1.5; }
    .reminder-source { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .done p.close-hint { color: var(--muted); font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card" id="flow">
    <h1>Quick check-in</h1>
    <div class="sub">A few taps, that's it.</div>
    <div id="steps"></div>
  </div>

  <div class="card done" id="done">
    <div class="check">✓</div>
    <h2>Logged</h2>
    <div id="reminder-slot-1"></div>
    <div id="reminder-slot-2"></div>
    <p class="close-hint">You can close this tab now.</p>
  </div>

  <script>
    // Two randomly picked questions from the pool, each with its own chip suggestions
    const questions = <?!= questionsJson ?>;
    // The note step is always last, appended after the two random questions
    const steps = questions.concat([{ id: '__note__', prompt: 'Leave a note for future you', type: 'note' }]);

    let currentStep = 0;
    const answers = {}; // keyed by question id

    const stepsContainer = document.getElementById('steps');

    function renderStep(index) {
      stepsContainer.innerHTML = '';
      const q = steps[index];
      const isFirst = index === 0;
      const isLast = index === steps.length - 1;

      const wrapper = document.createElement('div');
      wrapper.className = 'step active';

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = q.prompt;
      wrapper.appendChild(label);

      if (q.type === 'note') {
        const hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = "Optional — it'll show up at your next check-in.";
        wrapper.appendChild(hint);

        const textarea = document.createElement('textarea');
        textarea.id = 'input-note';
        textarea.placeholder = 'e.g. remember why you started this today';
        textarea.value = answers['__note__'] || '';
        textarea.addEventListener('input', (e) => { answers['__note__'] = e.target.value; });
        wrapper.appendChild(textarea);
      } else {
        const chipsDiv = document.createElement('div');
        chipsDiv.className = 'chips';
        (q.chips || []).forEach(word => {
          const btn = document.createElement('button');
          btn.className = 'chip';
          btn.textContent = word;
          if (answers[q.id] === word) btn.classList.add('selected');
          btn.onclick = () => {
            answers[q.id] = word;
            document.getElementById('input-' + q.id).value = '';
            updateNextState();
            renderStep(currentStep); // re-render to show selection
          };
          chipsDiv.appendChild(btn);
        });
        wrapper.appendChild(chipsDiv);

        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'input-' + q.id;
        input.placeholder = 'or type your own';
        if (answers[q.id] && !(q.chips || []).includes(answers[q.id])) {
          input.value = answers[q.id];
        }
        input.addEventListener('input', (e) => {
          answers[q.id] = e.target.value.trim();
          updateNextState();
        });
        wrapper.appendChild(input);
      }

      const nav = document.createElement('div');
      nav.className = 'nav';

      if (!isFirst) {
        const backBtn = document.createElement('button');
        backBtn.className = 'secondary';
        backBtn.textContent = 'Back';
        backBtn.onclick = () => { currentStep--; renderStep(currentStep); };
        nav.appendChild(backBtn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'primary';
      nextBtn.id = 'next-btn';
      nextBtn.textContent = isLast ? 'Log it' : 'Next';
      if (q.type !== 'note') {
        nextBtn.disabled = !answers[q.id];
      }
      nextBtn.onclick = () => {
        if (isLast) {
          submit();
        } else {
          currentStep++;
          renderStep(currentStep);
        }
      };
      nav.appendChild(nextBtn);

      wrapper.appendChild(nav);
      stepsContainer.appendChild(wrapper);
    }

    function updateNextState() {
      const q = steps[currentStep];
      const btn = document.getElementById('next-btn');
      if (btn && q.type !== 'note') {
        btn.disabled = !answers[q.id];
      }
    }

    function submit() {
      const nextBtn = document.getElementById('next-btn');
      nextBtn.disabled = true;
      nextBtn.textContent = 'Saving...';

      const q1 = questions[0];
      const q2 = questions[1];

      google.script.run
        .withSuccessHandler((result) => {
          document.getElementById('flow').style.display = 'none';
          renderReminders(result);
          document.getElementById('done').classList.add('active');
        })
        .withFailureHandler((err) => {
          alert('Something went wrong: ' + err.message);
          nextBtn.disabled = false;
          nextBtn.textContent = 'Log it';
        })
        .submitCheckIn(q1.id, answers[q1.id], q2.id, answers[q2.id], answers['__note__'] || '');
    }

    function renderReminders(result) {
      const slot1 = document.getElementById('reminder-slot-1');
      const slot2 = document.getElementById('reminder-slot-2');

      if (result.previousNote) {
        slot1.innerHTML = `
          <div class="reminder-card">
            <div class="reminder-label">From your past self</div>
            <div class="reminder-text">${escapeHtml(result.previousNote)}</div>
          </div>`;
      }

      if (result.quote && result.quote.text) {
        slot2.innerHTML = `
          <div class="reminder-card">
            <div class="reminder-label">Random pull</div>
            <div class="reminder-text">${escapeHtml(result.quote.text)}</div>
            <div class="reminder-source">${escapeHtml(result.quote.source || '')}</div>
          </div>`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    renderStep(0);
  </script>
</body>
</html>
