<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  :root {
    --bg: #0a0a0d;
    --text: #f2f2f2;
    --muted: #9a9aa2;

    --urgent: #ff453a;
    --self: #32d74b;
    --content: #0a84ff;
    --study: #ffd60a;
    --agency: #ff9f0a;
    --others: #ff375f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  /* Soft colored blobs behind everything, so the glass blur has something to catch */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    z-index: 0;
  }
  .blob.b1 { width: 260px; height: 260px; background: var(--urgent); top: -60px; left: -60px; }
  .blob.b2 { width: 300px; height: 300px; background: var(--content); top: 10%; right: -100px; }
  .blob.b3 { width: 260px; height: 260px; background: var(--agency); bottom: -60px; left: 10%; }
  .blob.b4 { width: 240px; height: 240px; background: var(--self); bottom: 5%; right: 5%; }
  .blob.b5 { width: 220px; height: 220px; background: var(--others); top: 45%; left: 40%; }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .card {
    --c: var(--self); /* overridden per card */
    position: relative;
    border-radius: 22px;
    padding: 20px 16px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
      0 8px 28px rgba(0, 0, 0, 0.35),
      0 0 24px -6px var(--c),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active {
    transform: scale(0.96);
  }
  @media (hover: hover) {
    .card:hover {
      transform: translateY(-3px);
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.4),
        0 0 34px -4px var(--c),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--c);
    box-shadow: 0 0 10px 1px var(--c);
    margin-bottom: 12px;
  }
  .card .label {
    font-size: 16px;
    font-weight: 700;
  }
  .card .tag {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .card.urgent { --c: var(--urgent); }
  .card.self { --c: var(--self); }
  .card.content { --c: var(--content); }
  .card.study { --c: var(--study); }
  .card.agency { --c: var(--agency); }
  .card.others { --c: var(--others); grid-column: span 2; }

  /* ---- Shared nav: real Minecraft hotbar PNG, full image, uncropped ---- */
  .mc-hotbar-wrap {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: min(360px, 92vw);
    z-index: 50;
  }
  .mc-hotbar-img {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: pixelated;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .mc-slot-hit {
    position: absolute;
    display: block;
    -webkit-tap-highlight-color: transparent;
  }
  .mc-active-highlight {
    position: absolute;
    border: 2px solid #fff;
    box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.8);
    border-radius: 2px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
  <div class="blob b5"></div>

  <nav class="mc-hotbar-wrap">
    <img src="assets/hotbar.png" alt="Nav: Dashboard / Life Log" class="mc-hotbar-img">
    <a href="index.html" class="mc-slot-hit" style="left:1.08%; top:54.55%; width:10.87%; height:41.82%;" aria-label="Dashboard"></a>
    <a href="lifelog.html" class="mc-slot-hit" style="left:11.95%; top:54.55%; width:10.87%; height:41.82%;" aria-label="Life Log"></a>
    <div class="mc-active-highlight" style="left:1.08%; top:54.55%; width:10.87%; height:41.82%;"></div>
  </nav>

  <div class="wrap" style="padding-bottom: 90px;">
    <h1>Dashboard</h1>
    <p class="sub">Everything, sorted.</p>

    <div class="grid">
      <div class="card urgent" data-key="urgent">
        <div class="dot"></div>
        <div class="label">Urgent</div>
      </div>
      <div class="card self" data-key="self">
        <div class="dot"></div>
        <div class="label">Self</div>
      </div>
      <div class="card content" data-key="content">
        <div class="dot"></div>
        <div class="label">Content</div>
      </div>
      <div class="card study" data-key="study">
        <div class="dot"></div>
        <div class="label">Study</div>
      </div>
      <div class="card agency" data-key="agency">
        <div class="dot"></div>
        <div class="label">Agency</div>
      </div>
      <div class="card others" data-key="others">
        <div class="dot"></div>
        <div class="label">Others</div>
        <div class="tag">pianoliew / xhs</div>
      </div>
    </div>
  </div>

<script>
  // Placeholder tap handler — wire each key up to a real page/tab when ready.
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const key = card.dataset.key;
      console.log('Tapped:', key);
      // e.g. window.location.href = `${key}.html`;
    });
  });
</script>
</body>
</html>
