<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  :root {
    --bg: #0a0a0d;
    --text: #f2f2f2;
    --muted: #9a9aa2;

    --urgent: #ff453a;
    --self: #32d74b;
    --content: #0a84ff;
    --study: #ffd60a;
    --agency: #ff9f0a;
    --others: #ff375f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  /* Soft colored blobs behind everything, so the glass blur has something to catch */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    z-index: 0;
  }
  .blob.b1 { width: 260px; height: 260px; background: var(--urgent); top: -60px; left: -60px; }
  .blob.b2 { width: 300px; height: 300px; background: var(--content); top: 10%; right: -100px; }
  .blob.b3 { width: 260px; height: 260px; background: var(--agency); bottom: -60px; left: 10%; }
  .blob.b4 { width: 240px; height: 240px; background: var(--self); bottom: 5%; right: 5%; }
  .blob.b5 { width: 220px; height: 220px; background: var(--others); top: 45%; left: 40%; }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .card {
    --c: var(--self); /* overridden per card */
    position: relative;
    border-radius: 22px;
    padding: 20px 16px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
      0 8px 28px rgba(0, 0, 0, 0.35),
      0 0 24px -6px var(--c),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active {
    transform: scale(0.96);
  }
  @media (hover: hover) {
    .card:hover {
      transform: translateY(-3px);
      box-shadow:
        0 14px 34px rgba(0, 0, 0, 0.4),
        0 0 34px -4px var(--c),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--c);
    box-shadow: 0 0 10px 1px var(--c);
    margin-bottom: 12px;
  }
  .card .label {
    font-size: 16px;
    font-weight: 700;
  }
  .card .tag {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .card.urgent { --c: var(--urgent); }
  .card.self { --c: var(--self); }
  .card.content { --c: var(--content); }
  .card.study { --c: var(--study); }
  .card.agency { --c: var(--agency); }
  .card.others { --c: var(--others); grid-column: span 2; }

  /* ---- Shared side nav ---- */
  .nav-toggle {
    position: fixed; top: 20px; left: 20px; z-index: 50;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--text); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .nav-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 40;
  }
  .nav-overlay.open { opacity: 1; pointer-events: auto; }
  .nav-drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 220px;
    background: rgba(20,20,24,0.88);
    backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%);
    border-right: 1px solid rgba(255,255,255,0.1);
    transform: translateX(-100%); transition: transform 0.25s ease; z-index: 45;
    padding: 70px 16px 20px; display: flex; flex-direction: column; gap: 4px;
  }
  .nav-drawer.open { transform: translateX(0); }
  .nav-title {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.06em; margin: 0 0 10px 14px;
  }
  .nav-link {
    display: block; padding: 12px 14px; border-radius: 12px;
    color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600;
  }
  .nav-link.active { background: rgba(255,255,255,0.12); }
  .nav-link:not(.active):hover { background: rgba(255,255,255,0.06); }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
  <div class="blob b5"></div>

  <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav-drawer" id="navDrawer">
    <div class="nav-title">Menu</div>
    <a href="index.html" class="nav-link active">Dashboard</a>
    <a href="lifelog.html" class="nav-link">Life Log</a>
  </nav>

  <div class="wrap">
    <h1>Dashboard</h1>
    <p class="sub">Everything, sorted.</p>

    <div class="grid">
      <div class="card urgent" data-key="urgent">
        <div class="dot"></div>
        <div class="label">Urgent</div>
      </div>
      <div class="card self" data-key="self">
        <div class="dot"></div>
        <div class="label">Self</div>
      </div>
      <div class="card content" data-key="content">
        <div class="dot"></div>
        <div class="label">Content</div>
      </div>
      <div class="card study" data-key="study">
        <div class="dot"></div>
        <div class="label">Study</div>
      </div>
      <div class="card agency" data-key="agency">
        <div class="dot"></div>
        <div class="label">Agency</div>
      </div>
      <div class="card others" data-key="others">
        <div class="dot"></div>
        <div class="label">Others</div>
        <div class="tag">pianoliew / xhs</div>
      </div>
    </div>
  </div>

<script>
  const navToggle = document.getElementById('navToggle');
  const navDrawer = document.getElementById('navDrawer');
  const navOverlay = document.getElementById('navOverlay');
  navToggle.addEventListener('click', () => {
    navDrawer.classList.toggle('open');
    navOverlay.classList.toggle('open');
  });
  navOverlay.addEventListener('click', () => {
    navDrawer.classList.remove('open');
    navOverlay.classList.remove('open');
  });

  // Placeholder tap handler — wire each key up to a real page/tab when ready.
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const key = card.dataset.key;
      console.log('Tapped:', key);
      // e.g. window.location.href = `${key}.html`;
    });
  });
</script>
</body>
</html>
