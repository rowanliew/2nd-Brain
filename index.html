<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f12">
<style>
  :root { --bg:#0f0f12; --card:#1a1a1f; --text:#f2f2f2; --muted:#9a9aa2; --accent:#6ee7b7; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); border-radius:16px; padding:32px; max-width:480px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  h1 { font-size:22px; margin:0 0 8px; } p.sub { color:var(--muted); margin:0 0 24px; font-size:14px; line-height:1.5; }
  .question { font-size:17px; margin:20px 0 8px; font-weight:600; }
  textarea { width:100%; min-height:80px; background:#111114; border:1px solid #2a2a30; border-radius:10px; color:var(--text); padding:12px; font-size:15px; font-family:inherit; resize:vertical; }
  button { margin-top:20px; width:100%; background:var(--accent); color:#06261b; border:0; border-radius:10px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; } button.secondary { background:transparent; color:var(--text); border:1px solid #2a2a30; margin-top:12px; }
  .status { margin-top:14px; font-size:13px; color:var(--muted); text-align:center; } .done { text-align:center; } .done .big { font-size:40px; margin-bottom:8px; }
</style>
</head>
<body>
  <div class="card" id="app"></div>
<script>
const QUESTIONS = [
  { id:0, text:'What\'s the most "main character" moment you had this week?' },
  { id:1, text:'Where did you feel most "awake" today, and where did you feel most numb?' },
  { id:2, text:"Name one thing you're avoiding. Why?" },
  { id:3, text:'What are you looking forward to?' }, { id:4, text:'1 word for now.' },
  { id:5, text:'Describe the situation right now in a prehistoric scenery.' },
  { id:6, text:'Describe your situation with a 3rd person perspective.' },
  { id:7, text:'If you could go back any time in the past week, when would you go and what would you change?' },
  { id:8, text:'Describe the situation right now in a natural setting (Sakura, Mountain, Forest, Pond).' },
  { id:9, text:"What did you protect today (your time, energy, image, peace)? Was it worth protecting?" },
  { id:10, text:'If today was a level in a video game, what was the boss fight?' },
  { id:11, text:'What was different in a thing that you do regularly today?' },
];

const API_BASE = 'https://twond-brain-mx2v.onrender.com';
const VAPID_PUBLIC_KEY = 'BJ25MtoCFLCqNg6zRF0VxwRA6cetF4r_WR527irNDvxGeLcsU16e33S96NA4ksI3x4aYt9uzhtvE8YGquQVE8mA';
const app = document.getElementById('app');
const params = new URLSearchParams(window.location.search);
const q1id = params.has('q1') ? parseInt(params.get('q1'),10) : null;
const q2id = params.has('q2') ? parseInt(params.get('q2'),10) : null;
if (q1id !== null && q2id !== null) renderLifeLog(q1id,q2id); else renderHome();

function renderHome() {
  app.innerHTML = `<h1>Life Log</h1><p class="sub">Get a random check-in prompt 3 times a day. Enable notifications to start.</p><button id="enableBtn">Enable notifications</button><button class="secondary" id="pushTestBtn">Send test push notification</button><button class="secondary" id="testBtn">Open a sample check-in now</button><div class="status" id="status"></div>`;
  document.getElementById('enableBtn').onclick = enableNotifications;
  document.getElementById('pushTestBtn').onclick = sendTestPush;
  document.getElementById('testBtn').onclick = () => { const [a,b]=pickTwo(); window.location.search=`?q1=${a.id}&q2=${b.id}`; };
}
function pickTwo() { const pool=[...QUESTIONS]; const first=pool.splice(Math.floor(Math.random()*pool.length),1)[0]; const second=pool.splice(Math.floor(Math.random()*pool.length),1)[0]; return [first,second]; }
async function sendTestPush() {
  const status=document.getElementById('status'), btn=document.getElementById('pushTestBtn'); btn.disabled=true; status.textContent='Sending...';
  try { const res=await fetch(`${API_BASE}/api/send-test`,{method:'POST'}); if(!res.ok) throw new Error(`Backend returned ${res.status}`); const data=await res.json(); status.textContent=data.sent>0?`Sent to ${data.sent} device(s). Check your notifications.`:'No subscribed devices found — enable notifications first.'; }
  catch(err) { console.error(err); status.textContent='Could not reach the backend. Check that Render is awake.'; } finally { btn.disabled=false; }
}
function renderLifeLog(id1,id2) {
  const q1=QUESTIONS.find(q=>q.id===id1)||QUESTIONS[0], q2=QUESTIONS.find(q=>q.id===id2)||QUESTIONS[1];
  app.innerHTML=`<h1>Life Log</h1><p class="sub">Answer honestly. Takes a minute.</p><div class="question">${q1.text}</div><textarea id="a1" placeholder="Your answer..."></textarea><div class="question">${q2.text}</div><textarea id="a2" placeholder="Your answer..."></textarea><button id="submitBtn">Save entry</button><div class="status" id="status"></div>`;
  document.getElementById('submitBtn').onclick=async()=>{ const a1=document.getElementById('a1').value.trim(),a2=document.getElementById('a2').value.trim(),btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Saving...'; try { const res=await fetch(`${API_BASE}/api/entry`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q1_id:q1.id,q1_text:q1.text,a1,q2_id:q2.id,q2_text:q2.text,a2})}); if(!res.ok) throw new Error('Save failed'); app.innerHTML='<div class="done"><div class="big">✓</div><h1>Saved</h1><p class="sub">See you next time.</p></div>'; } catch(err) { document.getElementById('status').textContent='Could not save — check your connection and try again.'; btn.disabled=false; btn.textContent='Save entry'; } };
}
async function enableNotifications() {
  const status=document.getElementById('status');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { status.textContent='Push notifications are not supported in this browser.'; return; }
  try {
    status.textContent='Requesting permission...';
    const permission=await Notification.requestPermission();
    if(permission!=='granted'){ status.textContent=permission==='denied'?'Permission denied. Enable notifications for this site in browser settings.':'Permission dismissed.'; return; }
    const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
    await navigator.serviceWorker.ready;
    let subscription=await registration.pushManager.getSubscription();
    if(subscription) await subscription.unsubscribe();
    subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    const res=await fetch(`${API_BASE}/api/subscribe`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(subscription)});
    if(!res.ok) throw new Error(`Subscribe failed (${res.status})`);
    status.textContent='Notifications enabled. You\'re all set.';
  } catch(err) { console.error('Notification setup failed:',err); status.textContent=`Could not enable notifications: ${err.message||'unknown error'}`; }
}
function urlBase64ToUint8Array(base64String) { const padding='='.repeat((4-(base64String.length%4))%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/'),rawData=atob(base64),outputArray=new Uint8Array(rawData.length); for(let i=0;i<rawData.length;++i) outputArray[i]=rawData.charCodeAt(i); return outputArray; }
</script>
</body>
</html>
