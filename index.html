<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dashersw/liquid-glass-js@main/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/dashersw/liquid-glass-js@main/glass.css">
<style>
  :root {
    --bg: #0a0a0d;
    --text: #f2f2f2;
    --muted: #9a9aa2;

    --urgent: #ff453a;
    --self: #32d74b;
    --content: #0a84ff;
    --study: #ffd60a;
    --agency: #ff9f0a;
    --others: #ff375f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  /* Soft colored blobs behind everything, so the glass blur has something to catch */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.35;
    z-index: 0;
  }
  .blob.b1 { width: 260px; height: 260px; background: var(--urgent); top: -60px; left: -60px; }
  .blob.b2 { width: 300px; height: 300px; background: var(--content); top: 10%; right: -100px; }
  .blob.b3 { width: 260px; height: 260px; background: var(--agency); bottom: -60px; left: 10%; }
  .blob.b4 { width: 240px; height: 240px; background: var(--self); bottom: 5%; right: 5%; }
  .blob.b5 { width: 220px; height: 220px; background: var(--others); top: 45%; left: 40%; }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  /* Wrapper around each liquid-glass Button, positioned as a grid cell */
  .glass-cell {
    --c: var(--self);
    position: relative;
    min-height: 120px;
    border-radius: 22px;
    cursor: pointer;
  }
  .glass-cell .glass-container,
  .glass-cell .glass-button {
    width: 100% !important;
    height: 100% !important;
    box-shadow:
      0 8px 28px rgba(0, 0, 0, 0.35),
      0 0 24px -6px var(--c) !important;
  }
  .glass-cell .glass-button-text {
    font-size: 15px !important;
    font-weight: 700 !important;
  }
  .glass-cell .tag {
    position: absolute;
    left: 16px;
    bottom: 10px;
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
  }

  .glass-cell.urgent { --c: var(--urgent); }
  .glass-cell.self { --c: var(--self); }
  .glass-cell.content { --c: var(--content); }
  .glass-cell.study { --c: var(--study); }
  .glass-cell.agency { --c: var(--agency); }
  .glass-cell.others { --c: var(--others); grid-column: span 2; }

  /* ---- Shared side nav ---- */
  .nav-toggle {
    position: fixed; top: 20px; left: 20px; z-index: 50;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--text); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .nav-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 40;
  }
  .nav-overlay.open { opacity: 1; pointer-events: auto; }
  .nav-drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 220px;
    background: rgba(20,20,24,0.88);
    backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%);
    border-right: 1px solid rgba(255,255,255,0.1);
    transform: translateX(-100%); transition: transform 0.25s ease; z-index: 45;
    padding: 70px 16px 20px; display: flex; flex-direction: column; gap: 4px;
  }
  .nav-drawer.open { transform: translateX(0); }
  .nav-title {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.06em; margin: 0 0 10px 14px;
  }
  .nav-link {
    display: block; padding: 12px 14px; border-radius: 12px;
    color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600;
  }
  .nav-link.active { background: rgba(255,255,255,0.12); }
  .nav-link:not(.active):hover { background: rgba(255,255,255,0.06); }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
  <div class="blob b5"></div>

  <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav-drawer" id="navDrawer">
    <div class="nav-title">Menu</div>
    <a href="index.html" class="nav-link active">Dashboard</a>
    <a href="lifelog.html" class="nav-link">Life Log</a>
  </nav>

  <div class="wrap">
    <h1>Dashboard</h1>
    <p class="sub">Everything, sorted.</p>

    <div class="grid" id="glassGrid"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/dashersw/liquid-glass-js@main/container.js"></script>
<script src="https://cdn.jsdelivr.net/gh/dashersw/liquid-glass-js@main/button.js"></script>
<script>
  const navToggle = document.getElementById('navToggle');
  const navDrawer = document.getElementById('navDrawer');
  const navOverlay = document.getElementById('navOverlay');
  navToggle.addEventListener('click', () => {
    navDrawer.classList.toggle('open');
    navOverlay.classList.toggle('open');
  });
  navOverlay.addEventListener('click', () => {
    navDrawer.classList.remove('open');
    navOverlay.classList.remove('open');
  });

  const CATEGORIES = [
    { key: 'urgent',  label: 'Urgent'  },
    { key: 'self',    label: 'Self'    },
    { key: 'content', label: 'Content' },
    { key: 'study',   label: 'Study'   },
    { key: 'agency',  label: 'Agency'  },
    { key: 'others',  label: 'Others', tag: 'pianoliew / xhs' },
  ];

  const grid = document.getElementById('glassGrid');

  CATEGORIES.forEach(cat => {
    const cell = document.createElement('div');
    cell.className = `glass-cell ${cat.key}`;

    const btn = new Button({
      text: cat.label,
      size: 15,
      type: 'rounded',
      borderRadius: 22,
      tintOpacity: 0.22,
      onClick: () => {
        console.log('Tapped:', cat.key);
        // e.g. window.location.href = `${cat.key}.html`;
      },
    });

    cell.appendChild(btn.element);

    if (cat.tag) {
      const tagEl = document.createElement('div');
      tagEl.className = 'tag';
      tagEl.textContent = cat.tag;
      cell.appendChild(tagEl);
    }

    grid.appendChild(cell);

    // The library sizes its WebGL canvas from the DOM at creation time;
    // since our CSS stretches it to fill .glass-cell afterward, force a resync.
    requestAnimationFrame(() => {
      if (btn.updateSizeFromDOM) btn.updateSizeFromDOM();
    });
  });
</script>
</body>
</html>
