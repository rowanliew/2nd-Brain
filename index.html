<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Log</title>
<style>
  :root { --bg:#0f0f12; --card:#1a1a1f; --text:#f2f2f2; --muted:#9a9aa2; --accent:#6ee7b7; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); border-radius:16px; padding:32px; max-width:480px; width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,0.4); }
  h1 { font-size:22px; margin:0 0 8px; }
  p.sub { color:var(--muted); margin:0 0 24px; font-size:14px; line-height:1.5; }
  .question { font-size:17px; margin:20px 0 8px; font-weight:600; }
  textarea { width:100%; min-height:80px; background:#111114; border:1px solid #2a2a30;
    border-radius:10px; color:var(--text); padding:12px; font-size:15px; font-family:inherit; resize:vertical; }
  button { margin-top:20px; width:100%; background:var(--accent); color:#06261b; border:none;
    border-radius:10px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .status { margin-top:14px; font-size:13px; color:var(--muted); text-align:center; }
  .done { text-align:center; }
  .done .big { font-size:40px; margin-bottom:8px; }
</style>
</head>
<body>
  <div class="card" id="app">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== REPLACE THESE TWO VALUES (Supabase → Settings → API) =====
const SUPABASE_URL = "https://qjnccnpsmcrmdcbworot.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqbmNjbnBzbWNybWRjYndvcm90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2OTI1MDUsImV4cCI6MjEwNTI2ODUwNX0.i7_8d_RNHz3MJbp8GUZkfjUU51jk0K86rf-L9HWSLcQ"; // the "anon public" key, NOT the service_role key
// ==================================================================

const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const QUESTIONS = [
  { id: 0, text: "What's the most \"main character\" moment you had this week?" },
  { id: 1, text: "Where did you feel most \"awake\" today, and where did you feel most numb?" },
  { id: 2, text: "Name one thing you're avoiding. Why?" },
  { id: 3, text: "What are you looking forward to?" },
  { id: 4, text: "1 word for now." },
  { id: 5, text: "Describe the situation right now in a prehistoric scenery." },
  { id: 6, text: "Describe your situation with a 3rd person perspective." },
  { id: 7, text: "If you could go back any time in the past week, when would you go and what would you change?" },
  { id: 8, text: "Describe the situation right now in a natural setting (Sakura, Mountain, Forest, Pond)." },
  { id: 9, text: "What did you protect today (your time, energy, image, peace)? Was it worth protecting?" },
  { id: 10, text: "If today was a level in a video game, what was the boss fight?" },
  { id: 11, text: "What was different in a thing that you do regularly today?" },
];

function pickTwo() {
  const pool = [...QUESTIONS];
  const first = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
  const second = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
  return [first, second];
}

const app = document.getElementById('app');

try {
  if (!window.supabase) {
    throw new Error('The Supabase library failed to load from the CDN (cdn.jsdelivr.net). Check your internet connection, disable any content/ad blocker for this site, or try a different browser.');
  }

  const [q1, q2] = pickTwo();

  app.innerHTML = `
    <h1>Life Log</h1>
    <p class="sub">Answer honestly. Takes a minute.</p>
    <div class="question">${q1.text}</div>
    <textarea id="a1" placeholder="Your answer..."></textarea>
    <div class="question">${q2.text}</div>
    <textarea id="a2" placeholder="Your answer..."></textarea>
    <button id="submitBtn">Save entry</button>
    <div class="status" id="status"></div>
  `;

  document.getElementById('submitBtn').onclick = async () => {
    const a1 = document.getElementById('a1').value.trim();
    const a2 = document.getElementById('a2').value.trim();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    try {
      const { error } = await supabaseClient.from('entries').insert({
        q1_id: q1.id, q1_text: q1.text, a1,
        q2_id: q2.id, q2_text: q2.text, a2,
      });
      if (error) throw error;
      app.innerHTML = `<div class="done"><div class="big">✓</div><h1>Saved</h1><p class="sub">See you next time.</p></div>`;
    } catch (err) {
      console.error(err);
      document.getElementById('status').textContent = 'Could not save: ' + (err.message || 'unknown error');
      btn.disabled = false;
      btn.textContent = 'Save entry';
    }
  };
} catch (err) {
  console.error(err);
  app.innerHTML = `<h1>Something went wrong</h1><p class="sub" style="color:#f2a3a3">${err.message}</p>`;
}
</script>
</body>
</html>
