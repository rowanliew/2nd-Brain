<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Log</title>
<style>
  :root { --bg:#0f0f12; --card:#1a1a1f; --text:#f2f2f2; --muted:#9a9aa2; --accent:#6ee7b7; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); border-radius:16px; padding:32px; max-width:600px; width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,0.4); }
  h1 { font-size:22px; margin:0 0 8px; }
  p.sub { color:var(--muted); margin:0 0 24px; font-size:14px; line-height:1.5; }
  .question { font-size:17px; margin:20px 0 8px; font-weight:600; }
  textarea { width:100%; min-height:80px; background:#111114; border:1px solid #2a2a30;
    border-radius:10px; color:var(--text); padding:12px; font-size:15px; font-family:inherit; resize:vertical; }
  button { margin-top:20px; width:100%; background:var(--accent); color:#06261b; border:none;
    border-radius:10px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .status { margin-top:14px; font-size:13px; color:var(--muted); text-align:center; }
  .done { text-align:center; }
  .done .big { font-size:40px; margin-bottom:8px; }
  .week-scroll { display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; margin-top:8px; }
  .day-col { flex:0 0 160px; background:#111114; border:1px solid #2a2a30; border-radius:12px; padding:12px; }
  .day-header { font-weight:700; font-size:13px; color:var(--accent); margin-bottom:10px; }
  .entry { margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid #23232a; }
  .entry:last-child { border-bottom:none; margin-bottom:0; }
  .entry-q { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .entry-a { font-size:13px; margin-bottom:8px; word-wrap:break-word; }
  .entry .empty { color:#5c5c64; font-style:italic; }
  .empty-day { font-size:12px; color:#5c5c64; font-style:italic; }

  /* ---- Shared side nav ---- */
  .nav-toggle {
    position: fixed; top: 20px; left: 20px; z-index: 50;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--text); font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .nav-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 40;
  }
  .nav-overlay.open { opacity: 1; pointer-events: auto; }
  .nav-drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 220px;
    background: rgba(20,20,24,0.88);
    backdrop-filter: blur(30px) saturate(160%); -webkit-backdrop-filter: blur(30px) saturate(160%);
    border-right: 1px solid rgba(255,255,255,0.1);
    transform: translateX(-100%); transition: transform 0.25s ease; z-index: 45;
    padding: 70px 16px 20px; display: flex; flex-direction: column; gap: 4px;
  }
  .nav-drawer.open { transform: translateX(0); }
  .nav-title {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.06em; margin: 0 0 10px 14px;
  }
  .nav-link {
    display: block; padding: 12px 14px; border-radius: 12px;
    color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600;
  }
  .nav-link.active { background: rgba(255,255,255,0.12); }
  .nav-link:not(.active):hover { background: rgba(255,255,255,0.06); }
</style>
</head>
<body>
  <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav-drawer" id="navDrawer">
    <div class="nav-title">Menu</div>
    <a href="index.html" class="nav-link">Dashboard</a>
    <a href="lifelog.html" class="nav-link active">Life Log</a>
  </nav>

  <div class="card" id="app">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== REPLACE THESE TWO VALUES (Supabase → Settings → API) =====
const SUPABASE_URL = "https://qjnccnpsmcrmdcbworot.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY"; // the "anon public" key, NOT the service_role key
// ==================================================================

const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const QUESTIONS = [
  { id: 0, text: "What's the most \"main character\" moment you had this week?" },
  { id: 1, text: "Where did you feel most \"awake\" today, and where did you feel most numb?" },
  { id: 2, text: "Name one thing you're avoiding. Why?" },
  { id: 3, text: "What are you looking forward to?" },
  { id: 4, text: "1 word for now." },
  { id: 5, text: "Describe the situation right now in a prehistoric scenery." },
  { id: 6, text: "Describe your situation with a 3rd person perspective." },
  { id: 7, text: "If you could go back any time in the past week, when would you go and what would you change?" },
  { id: 8, text: "Describe the situation right now in a natural setting (Sakura, Mountain, Forest, Pond)." },
  { id: 9, text: "What did you protect today (your time, energy, image, peace)? Was it worth protecting?" },
  { id: 10, text: "If today was a level in a video game, what was the boss fight?" },
  { id: 11, text: "What was different in a thing that you do regularly today?" },
];

function pickTwo() {
  const pool = [...QUESTIONS];
  const first = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
  const second = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
  return [first, second];
}

const app = document.getElementById('app');

try {
  if (!window.supabase) {
    throw new Error('The Supabase library failed to load from the CDN (cdn.jsdelivr.net). Check your internet connection, disable any content/ad blocker for this site, or try a different browser.');
  }

  const [q1, q2] = pickTwo();

  app.innerHTML = `
    <h1>Life Log</h1>
    <p class="sub">Answer honestly. Takes a minute.</p>
    <div class="question">${q1.text}</div>
    <textarea id="a1" placeholder="Your answer..."></textarea>
    <div class="question">${q2.text}</div>
    <textarea id="a2" placeholder="Your answer..."></textarea>
    <button id="submitBtn">Save entry</button>
    <div class="status" id="status"></div>
  `;

  document.getElementById('submitBtn').onclick = async () => {
    const a1 = document.getElementById('a1').value.trim();
    const a2 = document.getElementById('a2').value.trim();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    try {
      const { error } = await sb.from('entries').insert({
        q1_id: q1.id, q1_text: q1.text, a1,
        q2_id: q2.id, q2_text: q2.text, a2,
      });
      if (error) throw error;
      await renderWeekView();
    } catch (err) {
      console.error(err);
      document.getElementById('status').textContent = 'Could not save: ' + (err.message || 'unknown error');
      btn.disabled = false;
      btn.textContent = 'Save entry';
    }
  };
} catch (err) {
  console.error(err);
  app.innerHTML = `<h1>Something went wrong</h1><p class="sub" style="color:#f2a3a3">${err.message}</p>`;
}

const TIMEZONE = 'Asia/Kuala_Lumpur';

function localDateKey(isoString) {
  // 'en-CA' gives YYYY-MM-DD directly
  return new Intl.DateTimeFormat('en-CA', { timeZone: TIMEZONE }).format(new Date(isoString));
}

function dayLabel(dateKey) {
  const d = new Date(dateKey + 'T12:00:00'); // noon avoids timezone edge issues
  return new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).format(d);
}

async function renderWeekView() {
  app.innerHTML = `<h1>Saved ✓</h1><p class="sub">Loading the past week...</p>`;

  const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
  const { data, error } = await sb
    .from('entries')
    .select('*')
    .gte('created_at', sevenDaysAgo)
    .order('created_at', { ascending: true });

  if (error) {
    app.innerHTML = `<h1>Saved ✓</h1><p class="sub" style="color:#f2a3a3">Could not load past logs: ${error.message}</p>`;
    return;
  }

  // Build the last 7 day keys (oldest to newest), so empty days still show a column
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const key = localDateKey(new Date(Date.now() - i * 24 * 60 * 60 * 1000).toISOString());
    days.push(key);
  }

  const byDay = {};
  days.forEach(k => (byDay[k] = []));
  (data || []).forEach(row => {
    const key = localDateKey(row.created_at);
    if (byDay[key]) byDay[key].push(row);
  });

  const columnsHtml = days.map(key => {
    const entries = byDay[key];
    const entriesHtml = entries.length
      ? entries.map(e => `
          <div class="entry">
            <div class="entry-q">${e.q1_text}</div>
            <div class="entry-a">${e.a1 || '<span class="empty">(no answer)</span>'}</div>
            <div class="entry-q">${e.q2_text}</div>
            <div class="entry-a">${e.a2 || '<span class="empty">(no answer)</span>'}</div>
          </div>
        `).join('')
      : `<div class="empty-day">No entry</div>`;
    return `
      <div class="day-col">
        <div class="day-header">${dayLabel(key)}</div>
        ${entriesHtml}
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <h1>Saved ✓</h1>
    <p class="sub">Your logs from the past week</p>
    <div class="week-scroll">${columnsHtml}</div>
  `;
}

const navToggle = document.getElementById('navToggle');
const navDrawer = document.getElementById('navDrawer');
const navOverlay = document.getElementById('navOverlay');
navToggle.addEventListener('click', () => {
  navDrawer.classList.toggle('open');
  navOverlay.classList.toggle('open');
});
navOverlay.addEventListener('click', () => {
  navDrawer.classList.remove('open');
  navOverlay.classList.remove('open');
});
</script>
</body>
</html>
